# ============================================
# 微信小程序商品监控系统 - 配置文件
# ============================================

# 微信小程序配置
wechat:
  appid: "DRUNKBAKER"  # 小程序 AppID
  # API 信息（需要通过抓包获取，以下为示例）
  api_base: "https://mdsr-weixin.shemian.com/api/v1"
  api_token: ""  # 从抓包获取 token

# 监控商品列表
products:
  - id: "MlAPdY61pKwy3zv"  # 商品 ID
    name: "DRUNKBAKER 精选商品"
    url: "小程序://DRUNKBAKER/MlAPdY61pKwy3zv"
    target_price: 29.9  # 目标价格（低于此价格告警）
    target_stock: 10    # 目标库存（低于此数量告警）
    enabled: true

# 监控设置
monitor:
  interval: 120         # 监控间隔（秒），建议不低于 60 秒
  request_timeout: 30   # 请求超时时间
  max_retries: 3        # 最大重试次数
  retry_delay: 5        # 重试间隔
  use_playwright: false # 是否使用 Playwright（复杂页面设为 true）

# Playwright 配置（当 use_playwright=true 时使用）
playwright:
  headless: true
  user_agent: "Mozilla/5.0 (iPhone; CPU iPhone OS 13_2_3 like Mac OS X) AppleWebKit/605.1.15"
  viewport_width: 375
  viewport_height: 812

# 告警通知配置
alert:
  # Discord 通知（通过 Webhook）
  discord:
    enabled: true
    webhook_url: "https://discord.com/api/webhooks/YOUR_WEBHOOK_ID/YOUR_TOKEN"
    mention_role_id: ""  # 可选：提及角色 ID

  # 企业微信通知
  wechat_work:
    enabled: false
    webhook_url: "https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=YOUR_KEY"

  # 邮件通知
  email:
    enabled: false
    smtp_server: "smtp.gmail.com"
    smtp_port: 587
    use_tls: true
    username: "your_email@gmail.com"
    password: "your_app_password"  # 应用专用密码
    recipients:
      - "recipient@example.com"

  # 冷却时间（秒），避免重复告警
  cooldown: 600

# 日志配置
logging:
  level: INFO
  file: logs/monitor.log
  max_size: 10485760  # 10MB
  backup_count: 5
  console: true

# 数据存储配置
storage:
  data_dir: data
  history_file: data/price_history.json
  alert_log: data/alerts.json
